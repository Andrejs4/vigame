name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned rather than ubuntu-latest: `playwright install --with-deps` only
    # knows the Ubuntu releases its Playwright version was built for, so move
    # to a newer image together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run smoke

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke-output/
          if-no-files-found: ignore
