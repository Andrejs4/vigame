# Vigame under a subfolder of an existing nginx site: put this inside the
# site's `server { ... }` block, then `nginx -t && systemctl reload nginx`.
# Players open https://your-site/vigame/ (with the trailing slash).

location /vigame/ {
    proxy_pass http://127.0.0.1:2567/;         # the trailing slash strips /vigame
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;    # WebSocket
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;                     # idle games keep their connection
}
